<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./pwa-icon.svg" type="image/svg+xml">
      <link rel="apple-touch-icon" href="./pwa-icon.svg" type="image/svg+xml">
<title>Mathbook</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f8ff;
      color: #132033;
      font-family: "Trebuchet MS", Verdana, Arial, sans-serif;
      line-height: 1.35;
    }

    #app {
      width: 95%;
      max-width: none;
      margin: 0 auto;
      padding: 10px 10px 16px;
    }

    h1 {
      margin: 0 0 4px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-weight: bold;
    }

    .intro {
      margin: 0 0 10px;
      color: #32455f;
      font-size: 14px;
    }

    #history {
      min-height: 140px;
      margin-bottom: 12px;
    }

    .record {
      margin-bottom: 12px;
      padding: 10px;
      border: 1px solid #7ea6cc;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 2px 0 #b5cde4;
    }

    .record.error {
      border-color: #c97474;
      background: #fff4f4;
    }

    .record.clickable {
      cursor: pointer;
    }

    .record.navSelected {
      border: 3px solid #c62828;
      box-shadow: 0 0 0 2px #ffd7d7, 0 2px 0 #d69a9a;
    }

    .recordLabel {
      margin: 0 0 5px;
      font-size: 12px;
      color: #4a5e78;
      font-weight: bold;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .historyInput {
      width: 100%;
      min-height: 0;
      height: auto;
      resize: none;
      margin: 0 0 8px;
      padding: 8px;
      border: 1px solid #a7c2dc;
      border-radius: 8px;
      background: #f7fbff;
      color: #18273b;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      line-height: 1.32;
      overflow: auto;
    }

    .historyOutput {
      margin: 0;
      padding: 9px 10px;
      border: 1px solid #cad9ea;
      border-radius: 8px;
      background: #f8fbff;
      color: #1d2e46;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
      min-height: 20px;
    }

    .record.error .historyOutput {
      border-color: #d7a4a4;
      background: #fff8f8;
      color: #7a1f1f;
    }

    .graphWrap {
      margin-top: 2px;
      padding: 8px;
      border: 1px solid #cad9ea;
      border-radius: 8px;
      background: #f8fbff;
    }

    .graphCanvas {
      display: block;
      width: 100%;
      max-width: 100%;
      border: 1px solid #99b7d4;
      background: #ffffff;
    }

    #composer {
      position: relative;
      padding: 10px;
      border: 2px solid #7ea6cc;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 2px 0 #b5cde4;
    }

    #composer.navMode {
      border-color: #3e6f9d;
      box-shadow: 0 2px 0 #9cbdd9;
    }

    #inputLabel {
      display: block;
      margin: 0 0 6px;
      font-size: 13px;
      color: #30465f;
      font-weight: bold;
    }

    #editor {
      display: block;
      width: 100%;
      min-height: 0;
      height: auto;
      overflow-y: hidden;
      resize: none;
      margin: 0 0 10px;
      padding: 10px;
      border: 1px solid #8db2d5;
      border-radius: 8px;
      background: #f7fbff;
      color: #132033;
      font-family: "Courier New", Courier, monospace;
      font-size: 15px;
      line-height: 1.34;
    }

    #editorSuggest {
      display: none;
      position: absolute;
      left: 10px;
      top: 10px;
      z-index: 30;
      width: 320px;
      max-width: calc(100% - 20px);
      border: 1px solid #8db2d5;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 6px 18px rgba(29, 63, 99, 0.16);
      overflow: hidden;
    }

    #editorSuggest.open {
      display: block;
    }

    .suggestMeta {
      padding: 6px 9px;
      border-bottom: 1px solid #d6e4f1;
      background: #f3f8fe;
      color: #4b627d;
      font-size: 12px;
      font-weight: bold;
    }

    .suggestList {
      max-height: 220px;
      overflow-y: auto;
    }

    .suggestItem {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      margin: 0;
      padding: 7px 10px;
      border: 0;
      border-top: 1px solid #edf4fb;
      background: #ffffff;
      color: #17314b;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .suggestItem:first-child {
      border-top: 0;
    }

    .suggestItem.active,
    .suggestItem:hover {
      background: #e8f3ff;
    }

    .suggestName {
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      font-weight: bold;
    }

    .suggestKind {
      color: #637c97;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: right;
      max-width: 62%;
    }

    #controlRow {
      width: 100%;
      display: flex;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px;
    }

    .group {
      border: 1px solid #98b9d8;
      border-radius: 10px;
      background: #f5faff;
      padding: 5px;
      min-height: 0;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      max-width: 100%;
      flex: 0 1 auto;
    }

    #exportGroup {
      flex: 0 0 auto;
      text-align: left;
    }

    .exportBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      margin: 0 6px 0 0;
      padding: 3px 6px;
      font-size: 13px;
      line-height: 1.05;
      height: 24px;
    }

    #controlSpacer {
      flex: 0 0 8px;
      min-width: 0;
    }

    #plotGroup {
      flex: 0 0 auto;
      height: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      margin-left: auto;
    }

    #keysOpenBtn {
      min-width: 0;
      width: 22px;
      padding: 0;
      height: 22px;
      font-size: 12px;
      line-height: 1;
      background: #d8ecff;
      border-color: #1a3a58;
      box-shadow: inset 0 1px 0 #eff8ff, 0 2px 0 #7da6c9;
    }

    #controlRow:not(.keysExpanded) #keysOpenBtn {
      display: inline-flex;
    }

    #controlRow.keysExpanded #keysOpenBtn {
      display: none;
    }

    #intModeGroup {
      flex: 0 0 auto;
      padding-left: 4px;
      padding-right: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    #menuGroup {
      position: relative;
      display: inline-flex;
      align-items: center;
      margin-right: 6px;
    }

    #menuBtn {
      min-width: 0;
      width: 22px;
      padding: 0;
      height: 22px;
      font-size: 13px;
      line-height: 22px;
      padding-top: 0;
      padding-bottom: 1px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #d8ecff;
      border-color: #1a3a58;
      box-shadow: inset 0 1px 0 #eff8ff, 0 2px 0 #7da6c9;
    }

    #menuDropdown {
      position: absolute;
      left: 0;
      bottom: calc(100% + 4px);
      z-index: 30;
      display: none;
      min-width: 112px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    #menuGroup.menuOpen #menuDropdown {
      display: block;
    }

    #menuDropdown .menuItem {
      -webkit-appearance: none;
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 0 0 3px 0;
      padding: 0 8px;
      height: 24px;
      line-height: 1;
      text-align: left;
      color: inherit;
      text-decoration: none;
      outline: none !important;
      box-shadow: inset 0 1px 0 #eff8ff, 0 2px 0 #7da6c9;
    }

    #menuDropdown .menuItem:last-child {
      margin-bottom: 0;
    }

    #menuDropdown .menuItem:focus {
      outline: none !important;
      box-shadow: inset 0 1px 0 #eff8ff, 0 2px 0 #7da6c9 !important;
    }

    #menuDropdown .menuItem:focus-visible {
      outline: none !important;
      box-shadow: inset 0 1px 0 #eff8ff, 0 2px 0 #7da6c9 !important;
    }

    #keysGroup {
      flex: 0 0 auto;
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      white-space: normal;
      --keys-row-h: 24px;
      --keys-gap: 3px;
      --keys-panel-max: 360px;
      --keys-font-size: 12px;
      --keys-large-font-size: 15px;
    }

    #keysGroup.keysDensitySplit {
      width: 100%;
      align-items: stretch;
      --keys-row-h: 23px;
      --keys-gap: 4px 6px;
      --keys-panel-max: none;
      --keys-font-size: 11px;
      --keys-large-font-size: 13px;
    }

    #keysGroup.keysDensityCompact {
      --keys-row-h: 22px;
      --keys-gap: 2px;
      --keys-panel-max: 320px;
      --keys-font-size: 11px;
      --keys-large-font-size: 14px;
    }

    #keysGroup.keysDensityTight {
      --keys-row-h: 20px;
      --keys-gap: 2px;
      --keys-panel-max: 288px;
      --keys-font-size: 10px;
      --keys-large-font-size: 12px;
    }

    #keysPanel {
      display: grid;
      width: 100%;
      max-width: var(--keys-panel-max);
      gap: var(--keys-gap);
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-rows: var(--keys-row-h);
    }

    #keysGroup.keysDensitySplit #keysPanel {
      width: 100%;
      max-width: none;
      gap: var(--keys-gap);
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(5, var(--keys-row-h));
      grid-auto-rows: var(--keys-row-h);
    }

    #keysGroup:not(.isOpen) #keysPanel .keyBtn {
      display: none;
    }

    #keysGroup:not(.isOpen) #keysPanel .keyBtn[data-action="toggleKeys"] {
      display: inline-block;
    }

    #keysGroup:not(.isOpen) #keysPanel {
      display: inline-flex;
      width: auto;
      max-width: none;
      gap: 6px;
      grid-template-columns: none;
      grid-auto-rows: auto;
      justify-content: center;
      align-items: center;
    }

    #keysGroup:not(.isOpen) #keysPanel .keyBtn[data-action="toggleKeys"] {
      width: auto;
      min-width: 72px;
      flex: 0 0 auto;
      font-size: 15px;
      border-radius: 11px;
      min-height: 24px;
    }

    .keyBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      width: 100%;
      padding: 4px 7px;
      border-radius: 8px;
      font-size: var(--keys-font-size);
      font-weight: bold;
      line-height: 1.1;
      background: #edf3fa;
      height: var(--keys-row-h);
    }
    .keySpecial {
      background: #d8ecff;
    }
    .keyDigit {
      background: #fbfcfe;
    }

    .keySpacer {
      display: block;
      width: 100%;
      height: 1px;
      visibility: hidden;
      pointer-events: none;
    }

    .keyLarge {
      padding: 3px 10px;
      font-size: var(--keys-large-font-size);
      min-height: 0;
      line-height: 1.05;
    }

    .modeTitle {
      margin-right: 8px;
      font-size: 12px;
      color: #324861;
      font-weight: bold;
    }

    #intModeGroup .modeOpt {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 2px;
      font-size: 7px !important;
      line-height: 1;
      white-space: nowrap;
      color: #132033;
    }

    #intModeGroup .modeOpt input {
      margin: 0 1px 0 0;
      transform: scale(0.68);
      transform-origin: center;
      flex: 0 0 auto;
    }

    #runGroup {
      flex: 0 0 auto;
      text-align: right;
      display: inline-flex;
      align-items: flex-start;
      gap: 6px;
    }

    #runGroup {
      justify-content: center;
      align-items: center;
      padding-left: 8px;
      padding-right: 8px;
    }

    #controlRow:not(.keysExpanded) #runGroup {
      display: none;
    }

    #runGroup.keysDensitySplit {
      width: 100%;
      flex: 1 1 100%;
      padding-left: 4px;
      padding-right: 4px;
    }

    .miniLabel {
      display: inline-block;
      margin-right: 0;
      font-size: 12px;
      color: #324861;
      vertical-align: middle;
    }

    .rangeInput {
      display: inline-block;
      width: 58px;
      margin-right: 0;
      padding: 3px 7px;
      border: 1px solid #8db2d5;
      border-radius: 6px;
      background: #ffffff;
      color: #132033;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      line-height: 1.05;
      vertical-align: middle;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 12px;
      border: 2px solid #1a3a58;
      border-radius: 11px;
      background: #b9dfff;
      color: #132033;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: inset 0 1px 0 #eff8ff, 0 2px 0 #7da6c9;
    }

    button:active {
      box-shadow: inset 0 1px 0 #eff8ff, 0 1px 0 #7da6c9;
    }

    #plotBtn {
      background: #bcebd2;
    }

    #plotBtn,
    #runBtn {
      width: auto;
      margin: 0 6px 0 0;
      padding: 3px 6px;
      font-size: 13px;
      line-height: 1.05;
      height: 24px;
      min-width: 0;
    }

    #keysToggleBtn {
      min-width: 0;
      width: 100%;
      padding: 3px 10px;
      line-height: 1.05;
      height: var(--keys-row-h);
      font-size: var(--keys-large-font-size);
      background: #d8ecff;
      border-color: #1a3a58;
      box-shadow: inset 0 1px 0 #eff8ff, 0 2px 0 #7da6c9;
    }

    #keysGroup.isOpen #keysToggleBtn {
      background: #a9d3f5;
      border-color: #1a3a58;
      box-shadow: inset 0 1px 0 #dff1ff, 0 1px 0 #7da6c9;
      transform: translateY(1px);
    }

    #runBtn {
      background: #ffdcb0;
    }

    @media (max-width: 600px) {
      #controlRow {
        flex-wrap: wrap;
        row-gap: 4px;
      }

      #exportGroup {
        width: 100%;
        margin-bottom: 0;
        text-align: left;
        white-space: normal;
      }

      .exportBtn {
        width: 90px;
        margin-left: 0;
        margin-right: 6px;
      }

      #controlSpacer {
        display: none;
      }

      #plotGroup {
        width: 100%;
        white-space: normal;
      }

      #plotBtn {
        margin-left: auto;
      }

      #runGroup {
        width: auto;
        margin-top: 4px;
        margin-left: auto;
      }

      #intModeGroup {
        width: 100%;
        white-space: normal;
        margin-top: 0;
        justify-content: flex-start;
      }

      #menuGroup {
        margin-right: 4px;
      }

      #runBtn {
        width: auto;
      }

      .rangeInput {
        width: 52px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>Mathbook</h1>
    <p class="intro"><a href="Manual.html">Manual: functions, constants, plotting, and history</a></p>

    <div id="history"></div>

    <div id="composer">
      <label id="inputLabel" for="editor">Input (JavaScript / expression)</label>
      <textarea id="editor" rows="1" spellcheck="false">sin(X)</textarea>
      <div id="editorSuggest" aria-hidden="true">
        <div class="suggestMeta" id="editorSuggestMeta">Suggestions</div>
        <div class="suggestList" id="editorSuggestList"></div>
      </div>

      <div id="controlRow">
        <div class="group" id="intModeGroup">          
          <div id="menuGroup">
            <button id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Menu" aria-label="Menu">≡</button>
            <div id="menuDropdown" role="menu" aria-label="Mathbook menu">
              <button id="manualBtn" class="exportBtn menuItem" type="button">Open Manual</button>
              <button id="resetBtn" class="exportBtn menuItem" type="button">Reset</button>
              <button id="copyBtn" class="exportBtn menuItem" type="button">Copy</button>
              <button id="saveBtn" class="exportBtn menuItem" type="button">Save</button>
            </div>
          </div>
          <label class="modeOpt"><input type="radio" name="intMode" id="intModeDec" value="DEC" checked> DEC</label>
          <label class="modeOpt"><input type="radio" name="intMode" id="intModeHex" value="HEX"> HEX</label>
          <label class="modeOpt"><input type="radio" name="intMode" id="intModeBin" value="BIN"> BIN</label>
          <label class="modeOpt"><input type="radio" name="intMode" id="intModeBits" value="BITS"> BITS</label>
        </div>
        <div id="controlSpacer"></div>
        <div class="group" id="plotGroup">
          <label class="miniLabel" for="xLow">X:</label>
          <input class="rangeInput" id="xLow" type="text" value="-10">
          <label class="miniLabel" for="xHigh">-</label>
          <input class="rangeInput" id="xHigh" type="text" value="10">
          <button id="plotBtn" type="button">Plot</button>
          <button id="runBtn" type="button">Eval</button>
          <button id="keysOpenBtn" type="button" title="Show keypad" aria-label="Show keypad">#</button>
        </div>
        <div class="group" id="runGroup">
          <div id="keysGroup">
          <div id="keysPanel">
            <button id="keysToggleBtn" class="keyBtn keyLarge keySpecial" type="button" data-action="toggleKeys">#</button>
            <button class="keyBtn keyLarge keySpecial" type="button" data-action="left">&#8592;</button>
            <button class="keyBtn keyLarge keySpecial" type="button" data-action="right">&#8594;</button>
            <button class="keyBtn keyLarge keySpecial" type="button" data-action="backspace">&#9003;</button>

            <button class="keyBtn" type="button" data-key="A">A</button>
            <button class="keyBtn" type="button" data-key="B">B</button>
            <button class="keyBtn" type="button" data-key="C">C</button>
            <button class="keyBtn keySpecial" type="button" data-action="clear">Clear</button>

            <button class="keyBtn" type="button" data-key="D">D</button>
            <button class="keyBtn" type="button" data-key="E">E</button>
            <button class="keyBtn" type="button" data-key="F">F</button>
            <button class="keyBtn" type="button" data-key="_">_</button>

            <button class="keyBtn" type="button" data-key="sin(">sin</button>
            <button class="keyBtn" type="button" data-key="cos(">cos</button>
            <button class="keyBtn" type="button" data-key="tan(">tan</button>
            <button class="keyBtn" type="button" data-key="sqrt(">sqrt</button>

            <button class="keyBtn" type="button" data-key="exp(">exp</button>
            <button class="keyBtn" type="button" data-key="log(">log</button>
            <button class="keyBtn" type="button" data-key="log10(">log10</button>
            <button class="keyBtn" type="button" data-key="X">X</button>

            <button class="keyBtn" type="button" data-key="[">[</button>
            <button class="keyBtn" type="button" data-key="]">]</button>
            <button class="keyBtn" type="button" data-key="(">(</button>
            <button class="keyBtn" type="button" data-key=")">)</button>

            <button class="keyBtn keyDigit" type="button" data-key="7">7</button>
            <button class="keyBtn keyDigit" type="button" data-key="8">8</button>
            <button class="keyBtn keyDigit" type="button" data-key="9">9</button>
            <button class="keyBtn" type="button" data-key="/">/</button>

            <button class="keyBtn keyDigit" type="button" data-key="4">4</button>
            <button class="keyBtn keyDigit" type="button" data-key="5">5</button>
            <button class="keyBtn keyDigit" type="button" data-key="6">6</button>
            <button class="keyBtn" type="button" data-key="*">*</button>

            <button class="keyBtn keyDigit" type="button" data-key="1">1</button>
            <button class="keyBtn keyDigit" type="button" data-key="2">2</button>
            <button class="keyBtn keyDigit" type="button" data-key="3">3</button>
            <button class="keyBtn" type="button" data-key="-">-</button>

            <button class="keyBtn keyDigit" type="button" data-key="0">0</button>
            <button class="keyBtn" type="button" data-key=".">.</button>
            <button class="keyBtn" type="button" data-key=",">,</button>
            <button class="keyBtn" type="button" data-key="+">+</button>
          </div>
        </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var historyEl = document.getElementById('history');
      var editorEl = document.getElementById('editor');
      var runBtn = document.getElementById('runBtn');
      var plotBtn = document.getElementById('plotBtn');
      var manualBtn = document.getElementById('manualBtn');
      var resetBtn = document.getElementById('resetBtn');
      var copyBtn = document.getElementById('copyBtn');
      var saveBtn = document.getElementById('saveBtn');
      var menuBtn = document.getElementById('menuBtn');
      var menuGroupEl = document.getElementById('menuGroup');
      var menuDropdownEl = document.getElementById('menuDropdown');
      var keysOpenBtn = document.getElementById('keysOpenBtn');
      var runGroupEl = document.getElementById('runGroup');
      var intModeGroupEl = document.getElementById('intModeGroup');
      var intModeDecEl = document.getElementById('intModeDec');
      var intModeHexEl = document.getElementById('intModeHex');
      var intModeBinEl = document.getElementById('intModeBin');
      var intModeBitsEl = document.getElementById('intModeBits');
      var keysGroupEl = document.getElementById('keysGroup');
      var keysPanelEl = document.getElementById('keysPanel');
      var controlRowEl = document.getElementById('controlRow');
      var xLowEl = document.getElementById('xLow');
      var xHighEl = document.getElementById('xHigh');
      var composerEl = document.getElementById('composer');
      var editorSuggestEl = document.getElementById('editorSuggest');
      var editorSuggestMetaEl = document.getElementById('editorSuggestMeta');

      function buildNamespaceEntries(objName) {
        var names;
        var i;

        if (!obj) return out;
        names = Object.getOwnPropertyNames(obj).sort();
        for (i = 0; i < names.length; i++) {
          key = names[i];
          if (key === 'length' || key === 'name' || key === 'prototype') continue;
          out.push({
            name: key + (typeof obj[key] === 'function' ? '(' : ''),
            insertText: key + (typeof obj[key] === 'function' ? '(' : ''),
            kind: objName + (typeof obj[key] === 'function' ? ' function' : ' property')

        return out;

      function getAutocompleteContext() {
        var value = editorEl.value;

        var namespaceMatch = left.match(/([A-Za-z_$][A-Za-z0-9_$]*)\.([A-Za-z0-9_$]*)$/);
        var plainMatch = left.match(/([A-Za-z_$][A-Za-z0-9_$]*)$/);
        if (namespaceMatch) {
          return {
            kind: 'namespace',
            namespace: namespaceMatch[1],
            prefix: namespaceMatch[2] || '',
            start: pos - namespaceMatch[2].length,
            end: pos
          };
        }
        if (plainMatch) {
          return {
            kind: 'plain',
            prefix: plainMatch[1],
            start: pos - plainMatch[1].length,
            end: pos
          };
        }
        return null;

          source = namespaceAutocompleteMap[ctx.namespace];
          prefix = ctx.prefix.toLowerCase();
          for (i = 0; i < source.length; i++) {

        for (i = 0; i < execCount; i++) {

          if (out && out.type === 'plot') {

          } else {

      function createPlotData(expressionText, xMin, xMax, sampleCount) {
        var seriesPoints = [];
        var i;
        var x;
        var y;
        var yRaw;
        var firstRaw;
        var isArrayResult;
        var arrLen = 0;
        var j;
        var item;
        var minY = 0;
        var maxY = 0;
        var hasValue = false;
        var customPlotResult = null;

        firstRaw = evaluateCode(expressionText, true, xMin, false);
        if (firstRaw && typeof firstRaw === 'object' && firstRaw.__mathbookPlotType === 'xy') {
          customPlotResult = firstRaw;
          return {
            seriesPoints: customPlotResult.seriesPoints || [],
            minY: customPlotResult.minY,
            maxY: customPlotResult.maxY,
            xMin: customPlotResult.minX,
            xMax: customPlotResult.maxX,
            drawPoints: !!customPlotResult.drawPoints
          };
        }
        if (!codeUsesPlotX(expressionText) && (isSignal(firstRaw) || isSpectrum(firstRaw) || isArray(firstRaw))) {
          customPlotResult = plotDataFromValue(firstRaw);
          return {
            seriesPoints: customPlotResult.seriesPoints || [],
            minY: customPlotResult.minY,
            maxY: customPlotResult.maxY,
            xMin: customPlotResult.minX,
            xMax: customPlotResult.maxX,
            drawPoints: !!customPlotResult.drawPoints
          };
        }

        for (i = 0; i < sampleCount; i++) {
          x = xMin + (xMax - xMin) * i / (sampleCount - 1);
          if (i === 0) {
            yRaw = firstRaw;
          } else {
            yRaw = evaluateCode(expressionText, true, x, false);
          }
          isArrayResult = Object.prototype.toString.call(yRaw) === '[object Array]';

          if (!isArrayResult) {
            y = Number(yRaw);
            if (seriesPoints.length < 1) {
              seriesPoints[0] = [];
            }
            if (!isFinite(y)) {
              seriesPoints[0][i] = null;
              continue;
            }
            seriesPoints[0][i] = { x: x, y: y };
            if (!hasValue) {
              minY = y;
              maxY = y;
              hasValue = true;
            } else {
              if (y < minY) {
                minY = y;
              }
              if (y > maxY) {
                maxY = y;
              }
            }
            continue;
          }

          arrLen = yRaw.length;
          for (j = 0; j < arrLen; j++) {
            if (seriesPoints.length <= j) {
              seriesPoints[j] = [];
            }
            item = Number(yRaw[j]);
            if (!isFinite(item)) {
              seriesPoints[j][i] = null;
              continue;
            }
            seriesPoints[j][i] = { x: x, y: item };
            if (!hasValue) {
              minY = item;
              maxY = item;
              hasValue = true;
            } else {
              if (item < minY) {
                minY = item;
              }
              if (item > maxY) {
                maxY = item;
              }
            }
          }
        }

        if (!hasValue) {
          throw new Error('Plot has no finite values in this range');
        }

        if (minY === maxY) {
          minY -= 1;
          maxY += 1;
        }

        return {
          seriesPoints: seriesPoints,
          minY: minY,
          maxY: maxY,
          drawPoints: false
        };
      }

      function xToPixel(x, xMin, xMax, left, width) {
        return left + (x - xMin) * width / (xMax - xMin);
      }

      function yToPixel(y, yMin, yMax, top, height) {
        return top + (yMax - y) * height / (yMax - yMin);
      }

      function pixelToX(px, xMin, xMax, left, width) {
        return xMin + (px - left) * (xMax - xMin) / width;
      }

      function pixelToY(py, yMin, yMax, top, height) {
        return yMax - (py - top) * (yMax - yMin) / height;
      }

      function getPlotArea(canvas) {
        return {
          left: 50,
          right: 14,
          top: 12,
          bottom: 28,
          width: canvas.width - 50 - 14,
          height: canvas.height - 12 - 28
        };
      }

      function clamp(value, low, high) {
        if (value < low) {
          return low;
        }
        if (value > high) {
          return high;
        }
        return value;
      }

      function niceStep(range, approxLines) {
        var raw = range / approxLines;
        var exp;
        var base;
        var norm;
        if (!isFinite(raw) || raw <= 0) {
          return 1;
        }
        exp = Math.floor(Math.log(raw) / Math.LN10);
        base = Math.pow(10, exp);
        norm = raw / base;
        if (norm <= 1) {
          return 1 * base;
        }
        if (norm <= 2) {
          return 2 * base;
        }
        if (norm <= 5) {
          return 5 * base;
        }
        return 10 * base;
      }

      function countStepDecimals(step) {
        var s = String(step);
        var dotPos = s.indexOf('.');
        if (dotPos < 0) {
          return 0;
        }
        return s.length - dotPos - 1;
      }

      function formatTickValue(value, step) {
        var decimals = countStepDecimals(step);
        var epsilon = Math.abs(step) * 1e-6;
        var fixedText;
        if (Math.abs(value) < epsilon) {
          return '0';
        }
        fixedText = value.toFixed(decimals);
        fixedText = fixedText.replace(/\.?0+$/, '');
        if (fixedText === '-0') {
          fixedText = '0';
        }
        return fixedText;
      }

      function drawPlotOnCanvas(canvas, plotData, xMin, xMax, yMin, yMax) {
        var ctx = canvas.getContext ? canvas.getContext('2d') : null;
        var w = canvas.width;
        var h = canvas.height;
        var seriesPoints = (plotData && plotData.seriesPoints) ? plotData.seriesPoints : [];
        var drawPoints = !!(plotData && plotData.drawPoints);
        var area = getPlotArea(canvas);
        var left = area.left;
        var right = area.right;
        var top = area.top;
        var pw = area.width;
        var ph = area.height;
        var xStep;
        var yStep;
        var xTick;
        var yTick;
        var xTickStart;
        var yTickStart;
        var xTickCount = 0;
        var yTickCount = 0;
        var i;
        var p;
        var px;
        var py;
        var axisY;
        var axisX;
        var xVal;
        var yVal;
        var hasSegmentPoint = false;
        var s;
        var series;
        var pointRadius;
        var seriesColors = ['#1f5a91', '#ad1f3c', '#2c7f36', '#8c4f18', '#6a2f91', '#00818a', '#5a5a0f'];

        if (!ctx) {
          return;
        }

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);

        xStep = niceStep(xMax - xMin, 16);
        yStep = niceStep(yMax - yMin, 16);
        xTickStart = Math.ceil(xMin / xStep) * xStep;
        yTickStart = Math.ceil(yMin / yStep) * yStep;

        ctx.save();
        ctx.beginPath();
        ctx.rect(left, top, pw, ph);
        ctx.clip();

        ctx.strokeStyle = '#d6e3ef';
        ctx.lineWidth = 1;
        xTick = xTickStart;
        while (xTick <= xMax + xStep * 0.5) {
          px = xToPixel(xTick, xMin, xMax, left, pw);
          ctx.beginPath();
          ctx.moveTo(px, top);
          ctx.lineTo(px, top + ph);
          ctx.stroke();
          xTick += xStep;
          xTickCount++;
          if (xTickCount > 200) {
            break;
          }
        }

        yTick = yTickStart;
        while (yTick <= yMax + yStep * 0.5) {
          py = yToPixel(yTick, yMin, yMax, top, ph);
          ctx.beginPath();
          ctx.moveTo(left, py);
          ctx.lineTo(left + pw, py);
          ctx.stroke();
          yTick += yStep;
          yTickCount++;
          if (yTickCount > 200) {
            break;
          }
        }

        if (xMin <= 0 && xMax >= 0) {
          axisX = xToPixel(0, xMin, xMax, left, pw);
          ctx.strokeStyle = '#8aa4be';
          ctx.beginPath();
          ctx.moveTo(axisX, top);
          ctx.lineTo(axisX, top + ph);
          ctx.stroke();
        }

        if (yMin <= 0 && yMax >= 0) {
          axisY = yToPixel(0, yMin, yMax, top, ph);
          ctx.strokeStyle = '#8aa4be';
          ctx.beginPath();
          ctx.moveTo(left, axisY);
          ctx.lineTo(left + pw, axisY);
          ctx.stroke();
        }

        for (s = 0; s < seriesPoints.length; s++) {
          series = seriesPoints[s];
          if (!series) {
            continue;
          }
          hasSegmentPoint = false;
          ctx.strokeStyle = seriesColors[s % seriesColors.length];
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (i = 0; i < series.length; i++) {
            p = series[i];
            if (!p) {
              if (hasSegmentPoint) {
                ctx.stroke();
                ctx.beginPath();
                hasSegmentPoint = false;
              }
              continue;
            }
            px = xToPixel(p.x, xMin, xMax, left, pw);
            py = yToPixel(p.y, yMin, yMax, top, ph);
            if (!hasSegmentPoint) {
              ctx.moveTo(px, py);
              hasSegmentPoint = true;
            } else {
              ctx.lineTo(px, py);
            }
          }
          if (hasSegmentPoint) {
            ctx.stroke();
          }
          if (drawPoints) {
            pointRadius = 3.2;
            ctx.fillStyle = seriesColors[s % seriesColors.length];
            for (i = 0; i < series.length; i++) {
              p = series[i];
              if (!p) {
                continue;
              }
              px = xToPixel(p.x, xMin, xMax, left, pw);
              py = yToPixel(p.y, yMin, yMax, top, ph);
              ctx.beginPath();
              ctx.arc(px, py, pointRadius, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
        ctx.restore();

        ctx.strokeStyle = '#7f9bb7';
        ctx.lineWidth = 1;
        ctx.strokeRect(left, top, pw, ph);

        ctx.fillStyle = '#324a63';
        ctx.font = '12px Trebuchet MS';

        ctx.textAlign = 'left';
        yTick = yTickStart;
        yTickCount = 0;
        while (yTick <= yMax + yStep * 0.5) {
          py = yToPixel(yTick, yMin, yMax, top, ph);
          ctx.fillText(formatTickValue(yTick, yStep), 4, py + 4);
          yTick += yStep;
          yTickCount++;
          if (yTickCount > 200) {
            break;
          }
        }

        ctx.textAlign = 'center';
        xTick = xTickStart;
        xTickCount = 0;
        while (xTick <= xMax + xStep * 0.5) {
          px = xToPixel(xTick, xMin, xMax, left, pw);
          ctx.fillText(formatTickValue(xTick, xStep), px, top + ph + 16);
          xTick += xStep;
          xTickCount++;
          if (xTickCount > 200) {
            break;
          }
        }
      }

            xMax: viewState.xMax,
            minY: viewState.yMin,
            maxY: viewState.yMax,
            seriesPoints: viewState.plotData.seriesPoints,
            drawPoints: !!viewState.plotData.drawPoints,
            focusX: viewState.focusX,
            focusY: viewState.focusY
          };
          plotPoints[recordIndex] = [viewState.focusX, viewState.focusY];
        }

        function updatePlotRange(newMin, newMax, newYMin, newYMax, focusX, focusY) {
          var nextData;
          if (!isFinite(newMin) || !isFinite(newMax) || newMax <= newMin) {
            return;
          }
          if (isFinite(newYMin) && isFinite(newYMax) && newYMax <= newYMin) {
            return;
          }
          try {
            nextData = createPlotData(expressionText, newMin, newMax, 360);
          } catch (err) {
            return;
          }
          viewState.xMin = newMin;
          viewState.xMax = newMax;
          viewState.plotData = nextData;
          if (isFinite(newYMin) && isFinite(newYMax)) {
            viewState.yMin = newYMin;
            viewState.yMax = newYMax;
          }
          if (isFinite(focusX) && isFinite(focusY)) {
            viewState.focusX = focusX;
            viewState.focusY = focusY;
          } else {
            viewState.focusX = (viewState.xMin + viewState.xMax) * 0.5;
            viewState.focusY = (viewState.yMin + viewState.yMax) * 0.5;
          }

          updateHistoryPlotState();
          redrawPlot();
        }

        function getLocalPoint(e) {

          var cy;
          if (!rect) {
            return null;

          cx = (e.clientX - rect.left) * canvas.width / rect.width;
          cy = (e.clientY - rect.top) * canvas.height / rect.height;
          return { x: cx, y: cy };
        }

        function drawDragBox() {
          var ctx = canvas.getContext ? canvas.getContext('2d') : null;
          var x1;
          var y1;
          var x2;
          var y2;
          var leftBox;
          var topBox;
          var wBox;
          var hBox;
          if (!ctx) {
            return;
          }
          redrawPlot();
          x1 = drag.startX;
          y1 = drag.startY;
          x2 = drag.nowX;
          y2 = drag.nowY;
          leftBox = (x1 < x2) ? x1 : x2;
          topBox = (y1 < y2) ? y1 : y2;
          wBox = Math.abs(x2 - x1);
          hBox = Math.abs(y2 - y1);
          ctx.fillStyle = 'rgba(37, 99, 235, 0.14)';
          ctx.strokeStyle = 'rgba(30, 64, 175, 0.9)';

        function performPan() {
          var area = getPlotArea(canvas);
          var dx = drag.nowX - drag.startX;
          var dy = drag.nowY - drag.startY;
          var xWidth = drag.panStartXMax - drag.panStartXMin;
          var yHeight = drag.panStartYMax - drag.panStartYMin;
          var xShift = dx * xWidth / area.width;
          var yShift = -dy * yHeight / area.height;
          updatePlotRange(
            drag.panStartXMin - xShift,
            drag.panStartXMax - xShift,
            drag.panStartYMin - yShift,
            drag.panStartYMax - yShift,
            viewState.focusX - xShift,
            viewState.focusY - yShift
          );

        function performBoxZoom() {
          var area = getPlotArea(canvas);
          var x1 = clamp(drag.startX, area.left, area.left + area.width);
          var x2 = clamp(drag.nowX, area.left, area.left + area.width);
          var y1 = clamp(drag.startY, area.top, area.top + area.height);
          var y2 = clamp(drag.nowY, area.top, area.top + area.height);
          var boxW = Math.abs(x2 - x1);
          var boxH = Math.abs(y2 - y1);
          var xMinLocal;
          var xMaxLocal;
          var yMinLocal;
          var yMaxLocal;
          var centerX;
          var centerY;
          var currentWidth;
          var currentHeight;
          var zoomOutFactor;
          var zoomOutFactorY;
          var newWidth;
          var newHeight;
          var zoomOutByDirection;
          var zoomOut;

          if (boxW < 4 || boxH < 4) {
            return;
          }

          xMinLocal = pixelToX((x1 < x2 ? x1 : x2), viewState.xMin, viewState.xMax, area.left, area.width);
          xMaxLocal = pixelToX((x1 > x2 ? x1 : x2), viewState.xMin, viewState.xMax, area.left, area.width);
          yMaxLocal = pixelToY((y1 < y2 ? y1 : y2), viewState.yMin, viewState.yMax, area.top, area.height);
          yMinLocal = pixelToY((y1 > y2 ? y1 : y2), viewState.yMin, viewState.yMax, area.top, area.height);

          zoomOutByDirection = (drag.nowY < drag.startY);
          zoomOut = (drag.button === 2) ? !zoomOutByDirection : zoomOutByDirection;

          if (!zoomOut) {
            updatePlotRange(
              xMinLocal,
              xMaxLocal,
              yMinLocal,
              yMaxLocal,
              (xMinLocal + xMaxLocal) * 0.5,
              (yMinLocal + yMaxLocal) * 0.5
            );
            return;
          }

          centerX = pixelToX((x1 + x2) * 0.5, viewState.xMin, viewState.xMax, area.left, area.width);
          centerY = pixelToY((y1 + y2) * 0.5, viewState.yMin, viewState.yMax, area.top, area.height);
          currentWidth = viewState.xMax - viewState.xMin;
          currentHeight = viewState.yMax - viewState.yMin;
          zoomOutFactor = area.width / boxW;
          zoomOutFactorY = area.height / boxH;
          if (zoomOutFactor < 1.05) {
            zoomOutFactor = 1.05;
          }
          if (zoomOutFactorY < 1.05) {
            zoomOutFactorY = 1.05;
          }
          newWidth = currentWidth * zoomOutFactor;
          newHeight = currentHeight * zoomOutFactorY;
          updatePlotRange(
            centerX - newWidth * 0.5,
            centerX + newWidth * 0.5,
            centerY - newHeight * 0.5,
            centerY + newHeight * 0.5,
            centerX,
            centerY
          );
        }

        function clickZoom(localX, localY, button) {
          var area = getPlotArea(canvas);
          var focusX;
          var focusY;
          var tx;
          var ty;
          var currentWidth;
          var currentHeight;
          var factor;
          var newWidth;
          var newHeight;
          var newXMin;
          var newYMax;
          if (localX < area.left || localX > area.left + area.width) {
            return;
          }
          if (localY < area.top || localY > area.top + area.height) {
            return;
          }
          focusX = pixelToX(localX, viewState.xMin, viewState.xMax, area.left, area.width);
          focusY = pixelToY(localY, viewState.yMin, viewState.yMax, area.top, area.height);
          tx = (localX - area.left) / area.width;
          ty = (localY - area.top) / area.height;
          currentWidth = viewState.xMax - viewState.xMin;
          currentHeight = viewState.yMax - viewState.yMin;
          factor = (button === 2) ? 2 : 0.5;
          newWidth = currentWidth * factor;
          newHeight = currentHeight * factor;
          newXMin = focusX - tx * newWidth;
          newYMax = focusY + ty * newHeight;
          updatePlotRange(
            newXMin,
            newXMin + newWidth,
            newYMax - newHeight,
            newYMax,
            focusX,
            focusY
          );
        }

        function wheelZoom(localX, localY, deltaY) {
          var area = getPlotArea(canvas);
          var focusX;
          var focusY;
          var tx;
          var ty;
          var currentWidth;
          var currentHeight;
          var factor;
          var newWidth;
          var newHeight;
          var newXMin;
          var newYMax;
          if (localX < area.left || localX > area.left + area.width) {
            return;
          }
          if (localY < area.top || localY > area.top + area.height) {
            return;
          }
          focusX = pixelToX(localX, viewState.xMin, viewState.xMax, area.left, area.width);
          focusY = pixelToY(localY, viewState.yMin, viewState.yMax, area.top, area.height);
          tx = (localX - area.left) / area.width;
          ty = (localY - area.top) / area.height;
          currentWidth = viewState.xMax - viewState.xMin;
          currentHeight = viewState.yMax - viewState.yMin;
          factor = (deltaY < 0) ? 0.85 : 1.15;
          newWidth = currentWidth * factor;
          newHeight = currentHeight * factor;
          newXMin = focusX - tx * newWidth;
          newYMax = focusY + ty * newHeight;
          updatePlotRange(
            newXMin,
            newXMin + newWidth,
            newYMax - newHeight,
            newYMax,
            focusX,
            focusY
          );
        }

        recordIndex = execCount;
        execCount += 1;
        record.className = 'record';
        viewState = {
          initialXMin: xMin,
          initialXMax: xMax,
          initialYMin: plotData.minY,
          initialYMax: plotData.maxY,
          xMin: xMin,
          xMax: xMax,
          yMin: plotData.minY,
          yMax: plotData.maxY,
          focusX: (savedView && isFinite(savedView.focusX)) ? Number(savedView.focusX) : ((xMin + xMax) * 0.5),
          focusY: (savedView && isFinite(savedView.focusY)) ? Number(savedView.focusY) : ((plotData.minY + plotData.maxY) * 0.5),

        };

        inputHistory[recordIndex] = expressionText;

        redrawPlot();

        canvas.onmousedown = function (e) {
          var ev = e || window.event;

            return;
          }
          drag.active = true;
          drag.moved = false;
          drag.button = btn;
          drag.startX = p.x;
          drag.startY = p.y;
          drag.nowX = p.x;
          drag.nowY = p.y;
          drag.panStartXMin = viewState.xMin;
          drag.panStartXMax = viewState.xMax;
          drag.panStartYMin = viewState.yMin;
          drag.panStartYMax = viewState.yMax;
          if (ev && ev.preventDefault) {
            ev.preventDefault();
          }
        };

        canvas.onmousemove = function (e) {
          var p;
          if (!drag.active) {
            return;
          }
          p = getLocalPoint(e || window.event);
          if (!p) {
            return;
          }
          drag.nowX = p.x;
          drag.nowY = p.y;
          if (Math.abs(drag.nowX - drag.startX) > 2 || Math.abs(drag.nowY - drag.startY) > 2) {

          }

            performPan();

          }

            e.preventDefault();
          }
        };

        canvas.onmouseup = function (e) {
          var p = getLocalPoint(e || window.event);

            return;
          }
          if (p) {
            drag.nowX = p.x;
            drag.nowY = p.y;
          }
          drag.active = false;

          if (drag.button === 1) {
            if (e && e.preventDefault) {
              e.preventDefault();
            }
            return;
          }

          if (drag.moved) {
            performBoxZoom();
            if (e && e.preventDefault) {
              e.preventDefault();
            }
            return;
          }

          if (p) {

          }
          if (e && e.preventDefault) {
            e.preventDefault();
          }
        };

        canvas.onclick = function (e) {

          }
          if (p.x < area.left || p.x > area.left + area.width || p.y < area.top || p.y > area.top + area.height) {
            updatePlotRange(
              viewState.initialXMin,
              viewState.initialXMax,
              viewState.initialYMin,

      function restoreSessionState() {
        var raw;
        var data;
        var i;
        var entry;
        var plotState;
        var plotData;
        if (!window.localStorage) return;
        try {
          raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          data = JSON.parse(raw);
        } catch (parseErr) {
          return;
        }
        if (!data || Object.prototype.toString.call(data.entries) !== '[object Array]') return;

        isRestoringState = true;
        clearNotebook();

        if (typeof data.intDisplayMode === 'string') setIntMode(data.intDisplayMode);
        if (typeof data.xLow !== 'undefined') xLowEl.value = String(data.xLow);
        if (typeof data.xHigh !== 'undefined') xHighEl.value = String(data.xHigh);
        if (typeof data.editorText !== 'undefined') editorEl.value = String(data.editorText);
        if (data.keysExpanded) {
          addClass(keysGroupEl, 'isOpen');
        } else {
          removeClass(keysGroupEl, 'isOpen');
        }
        syncKeysExpandedLayout();
        autoSizeEditor();

        for (i = 0; i < data.entries.length; i++) {
          entry = data.entries[i];
          if (!entry || typeof entry !== 'object') continue;
          if (entry.type === 'plot' && entry.plot) {
            plotState = entry.plot;
            try {
              plotData = {
                seriesPoints: plotState.seriesPoints || [],
                minY: isFinite(plotState.minY) ? Number(plotState.minY) : -1,
                maxY: isFinite(plotState.maxY) ? Number(plotState.maxY) : 1,
                drawPoints: !!plotState.drawPoints
              };
              appendGraphRecord(String(entry.input || ''), Number(plotState.xMin), Number(plotState.xMax), plotData, plotState);
            } catch (plotErr) {
              appendTextRecord(String(entry.input || ''), 'Failed to restore plot', true, { error: 'Failed to restore plot' });
            }
          } else {
            if (typeof entry.rawInt === 'number') {
              appendTextRecord(String(entry.input || ''), formatOutput(entry.rawInt), !!entry.isError, entry.rawInt);
            } else {
              appendTextRecord(String(entry.input || ''), String(entry.outputText || ''), !!entry.isError, String(entry.outputText || ''));
            }
          }
        }

        // Rebuild _, __, ___ from restored non-plot, non-error outputs.
        lastValue1 = undefined;
        lastValue2 = undefined;
        lastValue3 = undefined;
        for (i = 0; i < execCount; i++) {
          if (entryErrorFlags[i]) continue;
          if (outputHistory[i] && outputHistory[i].type === 'plot') continue;
          pushLastValue(outputHistory[i]);
        }

        isRestoringState = false;
        refreshIntegerOutputDisplays();
      }

      function runCurrentCode() {
        var code = normalizeEditorTextForExecute();
        var trimmed = trimText(code);
        var result;
        var errText;

        if (!trimmed.length) {
          appendTextRecord('', 'Empty input', true, { error: 'Empty input' });
          return;
        }

        try {
          result = evaluateCode(code, false, 0, true);
          appendTextRecord(code, formatOutput(result), false, result);
        } catch (err) {
          errText = String(err && err.message ? err.message : err);
          appendTextRecord(code, errText, true, { error: errText });
        }
      }

      function plotCurrentCode() {
        var code = normalizeEditorTextForExecute();
        var trimmed = trimText(code);
        var xMin = Number(xLowEl.value);
        var xMax = Number(xHighEl.value);
        var plotData;
        var errText;

        if (!trimmed.length) {
          appendTextRecord('', 'Empty input', true, { error: 'Empty input' });
          return;
        }

        if (!isFinite(xMin) || !isFinite(xMax)) {
          appendTextRecord(code, 'X range must be numbers', true, { error: 'X range must be numbers' });
          return;
        }

        if (xMax <= xMin) {
          appendTextRecord(code, 'X Max must be greater than X Min', true, { error: 'X Max must be greater than X Min' });
          return;
        }

        try {
          plotData = createPlotData(code, xMin, xMax, 360);
          appendGraphRecord(code, isFinite(plotData.xMin) ? plotData.xMin : xMin, isFinite(plotData.xMax) ? plotData.xMax : xMax, plotData);
        } catch (err) {
          errText = String(err && err.message ? err.message : err);
          appendTextRecord(code, errText, true, { error: errText });
        }
      }

      function handleEditorKeyDown(event) {
        var e = event || window.event;
        var keyCode = e.which || e.keyCode;

        if (mode !== 'edit') {
          return true;
        }

        if (autocompleteState.open) {
          if (keyCode === 38) {
            moveAutocompleteSelection(-1);
            return stopEvent(e);
          }

          if (keyCode === 40) {
            moveAutocompleteSelection(1);
            return stopEvent(e);
          }

          if (keyCode === 13 || keyCode === 9) {
            applyAutocompleteSelection(autocompleteState.activeIndex);
            return stopEvent(e);
          }

          if (keyCode === 27) {
            closeAutocomplete();
            return stopEvent(e);
          }
        }

        if (keyCode === 13 && e.ctrlKey) {
          smartEnterAction();
          return stopEvent(e);
        }

        if (keyCode === 13 && (e.altKey || e.shiftKey)) {
          return true;
        }

        if (keyCode === 13 && shouldAutoExecuteFromCurrentLine()) {
          smartEnterAction();
          return stopEvent(e);
        }

        if (keyCode === 38 && isCaretOnFirstLine()) {
          setMode('nav');
          return stopEvent(e);
        }

        return true;
      }

      function handleGlobalKeyDown(event) {
        var e = event || window.event;
        var keyCode = e.which || e.keyCode;

        if (keyCode === 9) {
          toggleMode();
          return stopEvent(e);
        }

        if (keyCode === 33) {
          if (mode !== 'nav') {
            setMode('nav');
            return stopEvent(e);
          }
          moveNavSelection(-1);
          return stopEvent(e);
        }

        if (keyCode === 34) {
          if (mode !== 'nav') {
            setMode('nav');
            return stopEvent(e);
          }
          moveNavSelection(1);
          return stopEvent(e);
        }

        if (mode === 'nav') {
          if (keyCode === 38) {
            moveNavSelection(-1);
            return stopEvent(e);
          }

          if (keyCode === 40) {
            moveNavSelection(1);
            return stopEvent(e);
          }

          if (keyCode === 13) {
            useSelectedNavExpression();
            return stopEvent(e);
          }
        }

        return true;
      }

      keysPanelEl.onclick = function (e) {
        var ev = e || window.event;
        var target = ev.target || ev.srcElement;
        var keyText;
        var action;
        if (!target || target.tagName !== 'BUTTON') return;
        keyText = target.getAttribute('data-key');
        action = target.getAttribute('data-action');
        if (keyText !== null) {
          insertAtCursor(keyText, true);
          return;
        }
        if (action === 'toggleKeys') {
          toggleKeysPanel();
          return;
        }
        if (action === 'left') {
          if (mode !== 'edit') {
            setMode('edit', { noFocus: true });
          }
          if (typeof editorEl.selectionStart === 'number' && editorEl.selectionStart > 0 && editorEl.setSelectionRange) {
            editorEl.setSelectionRange(editorEl.selectionStart - 1, editorEl.selectionStart - 1);
          }
          return;
        }
        if (action === 'right') {
          var nextPos;
          if (mode !== 'edit') {
            setMode('edit', { noFocus: true });
          }
          if (typeof editorEl.selectionStart === 'number' && editorEl.setSelectionRange) {
            nextPos = editorEl.selectionStart + 1;
            if (nextPos > editorEl.value.length) nextPos = editorEl.value.length;
            editorEl.setSelectionRange(nextPos, nextPos);
          }
          return;
        }
        if (action === 'backspace') {
          backspaceAtCursor(true);
          return;
        }
        if (action === 'clear') {
          if (mode !== 'edit') {
            setMode('edit', { noFocus: true });
          }
          editorEl.value = '';
          autoSizeEditor();
          saveSessionState();
          return;
        }
        if (action === 'newline') {
          insertAtCursor('\n', true);
        }
      };

        };
      }
      keysPanelEl.onmousedown = function (e) {
        var ev = e || window.event;
        var target = ev.target || ev.srcElement;
        if (target && target.tagName === 'BUTTON') {
          if (ev.preventDefault) {
            ev.preventDefault();
          } else {
            ev.returnValue = false;
          }
          return false;
        }
      };
      manualBtn.onclick = function () {
        window.location.href = 'Manual.html';
        setMenuOpen(false);
      };
      resetBtn.onclick = function () {
        clearNotebook();
        editorEl.value = '';
        xLowEl.value = '-10';
        xHighEl.value = '10';
        setIntMode('DEC');
        refreshIntegerOutputDisplays();
        setMode('edit');
        if (window.localStorage) {
          try { window.localStorage.removeItem(STORAGE_KEY); } catch (resetErr) {}
        }
        setMenuOpen(false);
      };
      copyBtn.onclick = function () {
        copyText(buildPlainTextExport());
        setMenuOpen(false);
      };
      saveBtn.onclick = function () {
        saveTextToFile(buildHtmlExport(), 'MathbookJS_Export_' + formatDateStamp() + '.html', 'text/html');
        setMenuOpen(false);
      };

      editorEl.onclick = function () {
        if (mode === 'nav') {
          setMode('edit');
        }
        updateAutocomplete();
      };
      editorEl.oninput = function () {
        autoSizeEditor();
        saveSessionState();
        updateAutocomplete();
      };
      editorEl.onkeyup = function (e) {
        var ev = e || window.event;
        var keyCode = ev.which || ev.keyCode;
        if (keyCode === 13 || keyCode === 38 || keyCode === 40 || keyCode === 27 || keyCode === 9) {
          return;
        }
        updateAutocomplete();
      };
      editorEl.onblur = function () {
        window.setTimeout(closeAutocomplete, 120);
      };
      xLowEl.onchange = saveSessionState;
      xHighEl.onchange = saveSessionState;
      editorSuggestListEl.onclick = function (e) {
        var ev = e || window.event;
        var target = ev.target || ev.srcElement;
        var index;
        while (target && target !== editorSuggestListEl && (!target.getAttribute || target.getAttribute('data-index') === null)) {
          target = target.parentNode;
        }
        if (!target || target === editorSuggestListEl) {
          return;
        }
        index = Number(target.getAttribute('data-index'));
        if (isFinite(index)) {
          applyAutocompleteSelection(index);
        }
      };

      if (editorEl.addEventListener) {
        editorEl.addEventListener('keydown', handleEditorKeyDown, false);
      } else {
        editorEl.onkeydown = handleEditorKeyDown;
      }

      namespaceAutocompleteMap.Math = buildNamespaceEntries('Math');
      namespaceAutocompleteMap.JSON = buildNamespaceEntries('JSON');
      namespaceAutocompleteMap.Array = buildNamespaceEntries('Array');
      namespaceAutocompleteMap.Object = buildNamespaceEntries('Object');
      if (window.addEventListener) {
        window.addEventListener('resize', positionAutocompletePopup, false);
      } else {
        window.onresize = positionAutocompletePopup;
      }

      if (document.addEventListener) {
        document.addEventListener('keydown', handleGlobalKeyDown, false);
        document.addEventListener('click', function (e) {
          var ev = e || window.event;
          var target = ev ? (ev.target || ev.srcElement) : null;
          setMenuOpen(false);
          if (editorSuggestEl && target !== editorEl && !editorSuggestEl.contains(target)) {
            closeAutocomplete();
          }
        }, false);
      } else {
        document.onkeydown = handleGlobalKeyDown;
        document.onclick = function () {
          setMenuOpen(false);
          closeAutocomplete();
        };
      }

      restoreSessionState();
      autoSizeEditor();
      syncKeysExpandedLayout();
      syncPreferGroupSize();
      setMode('edit');
      if (window.addEventListener) {
        window.addEventListener('resize', syncPreferGroupSize, false);
      } else {
        window.onresize = syncPreferGroupSize;
      }
    }());
  </script>
  <script src="./pwa-register.js"></script>
</body>
</html>
