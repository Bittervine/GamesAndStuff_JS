<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShotEmUp3D JS - Spaceship Viewer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070c;
      color: #d8e1ff;
      font-family: system-ui, sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    #hud {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      transform: scale(2);
      transform-origin: top left;
    }

    #shipName {
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(10, 14, 24, 0.72);
      border: 1px solid rgba(160, 190, 255, 0.18);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.3px;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }

    #status {
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(10, 14, 24, 0.62);
      border: 1px solid rgba(160, 190, 255, 0.12);
      font-size: 13px;
      line-height: 1.3;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }

    #fps {
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(10, 14, 24, 0.62);
      border: 1px solid rgba(160, 190, 255, 0.12);
      font-size: 13px;
      line-height: 1.3;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }

    #exitGridBtn {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid rgba(160, 190, 255, 0.28);
      background: rgba(18, 26, 44, 0.86);
      color: #d8e1ff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: none;
    }

    #exitGridBtn:hover {
      background: rgba(30, 42, 70, 0.92);
    }

      'Ship_TwoHoop_795072.glb',

      'Ship_TwoHoop_961380.glb'
    ];

    const CAMERA_TURN_IN_SECONDS = 0.9;
    const SHIP_SPIN_SECONDS = 8.8;
    const CAMERA_TURN_OUT_SECONDS = 0.9;

    let shipFiles = [];
    let shipOrder = [];
    let shipIndex = -1;
    let activeRig = null;
    let activeSpinNode = null;
    let activeModel = null;
    let gridRig = null;
    let gridShips = [];
    let sequencePhase = 'idle';
    let phaseStartTime = 0;
    let isSwitchingShip = false;
    let consecutiveLoadFailures = 0;
    let gridMode = false;

    const tempVecA = new THREE.Vector3();
    const tempVecB = new THREE.Vector3();
    const tempVecC = new THREE.Vector3();
    const modelForwardAxis = new THREE.Vector3(0, 0, 1);
    const modelGreenAxis = new THREE.Vector3(0, 1, 0);
    const alignQuat = new THREE.Quaternion();
    const basisMatrix = new THREE.Matrix4();
    const shipBehindOffset = new THREE.Vector3();
    const shipHorizontalAxis = new THREE.Vector3(1, 0, 0);
    const raycaster = new THREE.Raycaster();
    const pointerNdc = new THREE.Vector2();
    const gridDefaultCameraPos = new THREE.Vector3(0, 0, 30);
    const gridFocusedCameraPos = new THREE.Vector3();
    const gridLookTarget = new THREE.Vector3(0, 0, 0);
    let gridFocusedShip = null;

    function shipLabel(file) {
      return file.replace(/^.*[\\/]/, '').replace(/\.[^.]+$/, '');
    }

    function shuffleArray(items) {
      const result = items.slice();
      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function withDotSlash(file) {
      return file.startsWith('./') ? file : `./${file}`;
    }

    async function discoverModelFiles() {
      try {
        const response = await fetch('./', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const html = await response.text();
        const matches = Array.from(html.matchAll(/href=["']([^"']+\.glb(?:\?[^"']*)?)["']/gi))
          .map((m) => decodeURIComponent(m[1]).split('?')[0])
          .filter((href) => href.toLowerCase().endsWith('.glb'))
          .filter((href) => !href.includes('/'));
        const unique = Array.from(new Set(matches));
        if (unique.length > 0) {
          return unique;
        }
      } catch (error) {
        console.warn('Model auto-discovery failed, using fallback list.', error);
      }
      return fallbackModelFiles.slice();
    }

    function normalizeModel(sceneRoot) {
      sceneRoot.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(sceneRoot);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const scale = 2.8 / maxDim;

      sceneRoot.position.sub(center).multiplyScalar(scale);
      sceneRoot.scale.setScalar(scale);

      return sceneRoot;
    }

    function loadModel(file) {
      if (modelCache.has(file)) {
        return Promise.resolve(modelCache.get(file));
      }

      status.textContent = `Loading ${shipLabel(file)}...`;
      return new Promise((resolve, reject) => {
        loader.load(
          withDotSlash(file),
          (gltf) => {
            const prepared = normalizeModel(gltf.scene);
            modelCache.set(file, prepared);
            resolve(prepared);
          },
          undefined,
          (error) => reject(error)
        );
      });
    }

    function easeInOut(t) {
      const x = THREE.MathUtils.clamp(t, 0, 1);
      return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
    }

    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    function orientShipBehindCamera() {
      if (!activeRig || !activeSpinNode || !activeModel) {
        return;
      }

      const forward = new THREE.Vector3();
      const cameraRight = new THREE.Vector3();
      const worldUp = new THREE.Vector3(0, 1, 0);
      camera.getWorldDirection(forward);
      cameraRight.crossVectors(forward, worldUp).normalize();
      shipBehindOffset.copy(forward).multiplyScalar(-6);
      activeRig.position.copy(camera.position).add(shipBehindOffset);

      activeRig.quaternion.identity();
      activeSpinNode.quaternion.identity();
      activeModel.quaternion.copy(activeModel.userData.baseQuat);
      activeModel.rotation.set(0, 0, 0);
      activeSpinNode.rotation.set(0, 0, 0);

      tempVecA.copy(camera.position).sub(activeRig.position).normalize();
      tempVecB.copy(cameraRight);
      if (Math.abs(tempVecB.dot(worldUp)) > 0.98) {
        tempVecB.set(1, 0, 0);
      }
      tempVecB.normalize();
      tempVecC.copy(tempVecA).sub(tempVecB.clone().multiplyScalar(tempVecA.dot(tempVecB))).normalize();
      if (tempVecC.lengthSq() < 0.0001) {
        tempVecC.copy(modelGreenAxis).applyQuaternion(activeModel.quaternion).normalize();
      }

      const zAxis = tempVecB.clone();
      const yAxis = tempVecC.clone();
      const xAxis = new THREE.Vector3().crossVectors(yAxis, zAxis).normalize();
      yAxis.crossVectors(zAxis, xAxis).normalize();

      basisMatrix.makeBasis(xAxis, yAxis, zAxis);
      activeModel.quaternion.copy(new THREE.Quaternion().setFromRotationMatrix(basisMatrix));
    }

    function updateShipSpin(progress) {
      if (!activeSpinNode) {
        return;
      }
      const spinAmount = (780 * Math.PI / 180) * easeInOut(progress);
      activeSpinNode.quaternion.setFromAxisAngle(shipHorizontalAxis, spinAmount);
    }

    function clearSceneForGrid() {
      if (activeRig) {
        scene.remove(activeRig);
      }
      if (gridRig) {
        scene.remove(gridRig);
      }
      activeRig = null;
      activeSpinNode = null;
      activeModel = null;
      gridRig = null;
      gridShips = [];
      gridFocusedShip = null;
    }

    function addGridShip(model, position, scale, spinSeed) {
      const shipRoot = new THREE.Group();
      const spinNode = new THREE.Group();
      const modelClone = model.clone(true);
      spinNode.add(modelClone);
      shipRoot.add(spinNode);
      shipRoot.position.copy(position);
      shipRoot.scale.setScalar(scale);
      shipRoot.userData.spinNode = spinNode;
      shipRoot.userData.spinSeed = spinSeed;
      shipRoot.userData.shipFile = model.userData.shipFile || '';
      gridRig.add(shipRoot);
      gridShips.push({ root: shipRoot, spinNode, spinSeed });
    }

    function showGridExitButton(show) {
      exitGridBtn.style.display = show ? 'block' : 'none';
    }

    function resetGridCamera() {
      camera.position.copy(gridDefaultCameraPos);
      gridLookTarget.set(0, 0, 0);
      camera.lookAt(gridLookTarget);
      gridFocusedShip = null;
      status.textContent = 'Grid mode';
      shipName.textContent = `${gridShips.length} ships`;
    }

    function focusGridShip(shipRoot) {
      if (!shipRoot) {
        resetGridCamera();
        return;
      }
      gridFocusedShip = shipRoot;
      gridFocusedCameraPos.copy(shipRoot.position).add(new THREE.Vector3(0, 0.8, 5.2));
      camera.position.copy(gridFocusedCameraPos);
      gridLookTarget.copy(shipRoot.position);
      camera.lookAt(gridLookTarget);
      const label = shipLabel(shipRoot.userData.shipFile || '');
      shipName.textContent = label || 'Selected ship';
      status.textContent = 'Focused ship';
    }

    async function showGridMode() {
      gridMode = true;
      sequencePhase = 'idle';
      clearSceneForGrid();

      if (gridRig) {
        scene.remove(gridRig);
      }
      gridRig = new THREE.Group();
      scene.add(gridRig);

      const files = shipFiles.slice();
      const cols = Math.ceil(Math.sqrt(files.length));
      const rows = Math.ceil(files.length / cols);
      const spacingX = 3.05;
      const spacingY = 2.15;
      const startX = -((cols - 1) * spacingX) / 2;
      const startY = ((rows - 1) * spacingY) / 2;

      for (let i = 0; i < files.length; i += 1) {
        const file = files[i];
        const model = await loadModel(file);
        const clone = model.clone(true);
        clone.quaternion.copy(model.userData.baseQuat || clone.quaternion);
        clone.userData.shipFile = file;
        const col = i % cols;
        const row = Math.floor(i / cols);
        const scale = 0.74;
        const pos = new THREE.Vector3(startX + col * spacingX, startY - row * spacingY, 0);
        addGridShip(clone, pos, scale, i * 0.37 + 0.1);
      }

      resetGridCamera();
      showGridExitButton(true);
    }

    async function startLoopMode() {
      gridMode = false;
      if (gridRig) {
        scene.remove(gridRig);
      }
      gridRig = null;
      gridShips = [];
      gridFocusedShip = null;
      showGridExitButton(false);
      camera.rotation.set(0, 0, 0);
      await showNextShip(true);
    }

    async function showNextShip(isInitial = false) {
      if (isSwitchingShip || shipOrder.length === 0) {
        return;
      }
      isSwitchingShip = true;

      const nextIndex = (shipIndex + 1) % shipOrder.length;
      const nextFile = shipOrder[nextIndex];

      try {
        const nextModel = await loadModel(nextFile);
        consecutiveLoadFailures = 0;

        if (activeRig) {
          scene.remove(activeRig);
        }

        activeModel = nextModel;
        activeRig = new THREE.Group();
        activeSpinNode = new THREE.Group();
        activeSpinNode.add(activeModel);
        activeRig.add(activeSpinNode);
        scene.add(activeRig);
        shipIndex = nextIndex;
        if (!activeModel.userData.baseQuat) {
          activeModel.userData.baseQuat = activeModel.quaternion.clone();
        }

        orientShipBehindCamera();
        activeRig.updateMatrixWorld(true);
        activeSpinNode.updateMatrixWorld(true);
        activeModel.updateMatrixWorld(true);

        shipName.textContent = shipLabel(nextFile);
        status.textContent = `Ship ${shipIndex + 1} / ${shipOrder.length}`;

        sequencePhase = 'cameraTurnIn';
        phaseStartTime = clock.getElapsedTime();
      } catch (error) {
        console.error(error);
        shipIndex = nextIndex;
        consecutiveLoadFailures += 1;
        status.textContent = `Failed ${shipLabel(nextFile)}. Skipping...`;

        if (consecutiveLoadFailures >= shipOrder.length) {
          shipName.textContent = 'No loadable ships';
          flightPhase = 'idle';
          isSwitchingShip = false;
          return;
        }

        isSwitchingShip = false;
        setTimeout(() => {
          showNextShip(isInitial);
        }, 250);
        return;
      }

      isSwitchingShip = false;
    }

    async function startShowcase() {
      status.textContent = 'Scanning .glb files...';
      shipFiles = await discoverModelFiles();

      if (shipFiles.length === 0) {
        shipName.textContent = 'No ships found';
        status.textContent = 'No .glb files available.';
        return;
      }
      shipOrder = shuffleArray(shipFiles);
      shipName.textContent = `Found ${shipOrder.length} ships`;
      status.textContent = 'Starting sequence...';
      const params = new URLSearchParams(window.location.search);
      if (params.get('L') === '0') {
        await startLoopMode();
      } else {
        await showGridMode();
      }
    }

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function handleGridPointerDown(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNdc.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNdc.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointerNdc, camera);
      const hits = raycaster.intersectObjects(gridShips.map((item) => item.root), true);
      if (hits.length === 0) {
        focusGridShip(null);
        return;
      }
      let node = hits[0].object;
      while (node && node.parent && node.parent !== gridRig) {
        node = node.parent;
      }
      if (node && node.parent === gridRig) {
        focusGridShip(node);
      } else {
        focusGridShip(null);
      }
    }

    window.addEventListener('resize', resize);
    renderer.domElement.addEventListener('pointerdown', (event) => {
      if (gridMode) {
        handleGridPointerDown(event);
      } else {
        showGridMode();
      }
    });
    exitGridBtn.addEventListener('pointerdown', (event) => {
      event.stopPropagation();
      if (gridMode) {
        startLoopMode();
      }
    });

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      fpsTime += delta;
      fpsFrames += 1;
      if (fpsTime >= 0.5) {
        fps.textContent = `FPS: ${Math.round(fpsFrames / fpsTime)}`;
        fpsTime = 0;
        fpsFrames = 0;
      }

      if (activeModel && activeRig && activeSpinNode) {
        const phaseElapsed = clock.getElapsedTime() - phaseStartTime;

        if (sequencePhase === 'cameraTurnIn') {
          const t = Math.min(phaseElapsed / CAMERA_TURN_IN_SECONDS, 1);
          camera.rotation.y = THREE.MathUtils.lerp(0, Math.PI, easeInOut(t));
          if (t >= 1) {
            sequencePhase = 'shipSpin';
            phaseStartTime = clock.getElapsedTime();
          }
        } else if (sequencePhase === 'shipSpin') {
          const t = Math.min(phaseElapsed / SHIP_SPIN_SECONDS, 1);
          updateShipSpin(t);
          if (t >= 1) {
            sequencePhase = 'cameraTurnOut';
            phaseStartTime = clock.getElapsedTime();
          }
        } else if (sequencePhase === 'cameraTurnOut') {
          const t = Math.min(phaseElapsed / CAMERA_TURN_OUT_SECONDS, 1);
          camera.rotation.y = THREE.MathUtils.lerp(Math.PI, Math.PI * 2, easeInOut(t));
          if (t >= 1) {
            if (shipIndex >= shipOrder.length - 1) {
              showGridMode();
            } else {
              showNextShip(false);
            }
          }
        }
      } else if (gridMode && gridRig) {
        const elapsed = clock.getElapsedTime();
        for (let i = 0; i < gridShips.length; i += 1) {
          const item = gridShips[i];
          const speedJitter = 0.8 + (item.spinSeed % 0.4);
          const baseSpeed = 0.55;
          item.spinNode.rotation.x = elapsed * baseSpeed * speedJitter;
          item.spinNode.rotation.y = elapsed * baseSpeed * (0.95 + ((item.spinSeed * 1.7) % 0.1));
          item.spinNode.rotation.z = elapsed * baseSpeed * (0.85 + ((item.spinSeed * 2.3) % 0.3));
        }
      }

      renderer.render(scene, camera);
    }

    startShowcase();
    animate();
  </script>
</body>
</html>
