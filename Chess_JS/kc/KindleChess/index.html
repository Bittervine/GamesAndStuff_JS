        <script type="text/javascript">
              function onMyResize()
              {                                                    
                  var bo = document.getElementById("Board");     
                  var gz = document.getElementById("GameZone");   
                  var et = document.getElementById("EngineConfigTable");                  

                  var scale1 = (window.innerWidth)/(gz.offsetWidth+0);                      
                  var scale2 = (window.innerHeight)/(gz.offsetHeight+0);                                                                        
                  var scale = Math.min(scale1,scale2);
                         
                  //Kindle PW5 hack to get rid of scroll bar
                  //scale=1.5;

                  gz.style.zoom = scale;
                              
                  //et.style.zoom = (bo.offsetWidth)/(et.offsetWidth);                      

                  SetScale(scale);
                  //console.log(navigator);                  
              }
              function onMyInit() 
              {       
                  var bo = document.getElementById("Board");     
                  var gz = document.getElementById("GameZone");   
                  var et = document.getElementById("EngineConfigTable");                  
                  
                  et.style.zoom = (gz.offsetWidth)/(et.offsetWidth+30);                      
                  
                  window.onresize = onMyResize;
                  onMyResize()
                  
              }              
              // Let page load and then actually do init once document layout is complete...
              setTimeout(onMyInit,0);                            
        </script>
