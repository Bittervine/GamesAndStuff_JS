<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShotEmUp3D JS - Spaceship Viewer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070c;
      color: #d8e1ff;
      font-family: system-ui, sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    #hud {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 10;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
    }

    #loadModelBtn {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #8ec5ff;
      background: #74b8ff;
      color: #06213f;
      font-size: 14px;
      cursor: pointer;
    }

    #status {
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(10, 14, 24, 0.72);
      border: 1px solid rgba(160, 190, 255, 0.18);
      font-size: 14px;
      line-height: 1.3;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }

  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <button id="loadModelBtn" type="button">Load Model</button>
    <div id="status">Loading spaceship...</div>
  </div>
  <input id="modelFileInput" type="file" accept=".glb,model/gltf-binary" hidden>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const app = document.getElementById('app');
    const status = document.getElementById('status');
    const loadModelBtn = document.getElementById('loadModelBtn');
    const modelFileInput = document.getElementById('modelFileInput');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070c);
    scene.fog = new THREE.Fog(0x05070c, 10, 30);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 4.5, 0.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enablePan = false;
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 1.5;
    controls.maxDistance = 20;

    scene.add(new THREE.AmbientLight(0xbfd4ff, 1.6));

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(3, 5, 4);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x88aaff, 1.1);
    rimLight.position.set(-4, 1, -3);
    scene.add(rimLight);

    const loader = new GLTFLoader();
    let model = null;
    const GLB_FILE = './Ship_LunarCourier7.glb';
    function fitAndShowModel(sceneRoot) {
      if (model) {
        scene.remove(model);
      }
      model = sceneRoot;

      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const scale = 2.5 / maxDim;
      model.position.sub(center).multiplyScalar(scale);
      model.scale.setScalar(scale);

      scene.add(model);

      const framedBox = new THREE.Box3().setFromObject(model);
      const framedSize = framedBox.getSize(new THREE.Vector3());
      const distance = Math.max(framedSize.x, framedSize.y, framedSize.z) * 1.8;
      camera.position.set(0, distance * 1.25, distance * 0.2);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    function loadGlbFromBlob(blob, label = 'model') {
      const glbUrl = URL.createObjectURL(blob);
      status.textContent = `Loading ${label}...`;

      loader.load(
        glbUrl,
        (gltf) => {
          fitAndShowModel(gltf.scene);
          status.textContent = 'Loaded. Drag-free auto spin.';
          URL.revokeObjectURL(glbUrl);
        },
        undefined,
        (error) => {
          console.error(error);
          status.textContent = `Failed to load ${label}`;
          URL.revokeObjectURL(glbUrl);
        }
      );
    }

    loadModelBtn.addEventListener('click', () => modelFileInput.click());
    modelFileInput.addEventListener('change', () => {
      const file = modelFileInput.files?.[0];
      if (!file) {
        return;
      }
      loadGlbFromBlob(file, file.name);
      modelFileInput.value = '';
    });

    status.textContent = `Loading ${GLB_FILE}...`;
    loader.load(
      GLB_FILE,
      (gltf) => {
        fitAndShowModel(gltf.scene);
        status.textContent = 'Loaded. Drag-free auto spin.';
      },
      undefined,
      (error) => {
        console.error(error);
        status.textContent = `Failed to load ${GLB_FILE}`;
      }
    );

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('resize', resize);

    function animate() {
      requestAnimationFrame(animate);

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
