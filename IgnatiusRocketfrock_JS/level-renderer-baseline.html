<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="favicon.ico" sizes="any">
    <title>Ignatius Canvas Renderer Baseline</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #111019;
            --panel: rgba(17, 14, 24, 0.94);
            --ink: #f2edf8;
            --muted: #cdbfdc;
            --line: rgba(255,255,255,0.18);
            --accent: #c9a7ff;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        #toolbar, #readout {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--panel);
            border-color: var(--line);
            z-index: 2;
        }

        #toolbar { border-bottom: 1px solid var(--line); }
        #readout {
            border-top: 1px solid var(--line);
            min-width: 0;
            font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            white-space: nowrap;
        }

        #readout span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #readout-main { flex: 1 1 auto; }
        #readout-camera { flex: 0 0 auto; color: var(--muted); }

        button, select, input {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255,255,255,0.07);
            color: var(--ink);
            padding: 6px 8px;
            font: inherit;
        }

        button { cursor: pointer; }
        label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
        input[type="number"] { width: 88px; }
        .title { color: var(--accent); font-weight: 700; }
        .spacer { flex: 1 1 auto; }

        #viewport {
            position: relative;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: #171525;
            contain: strict;
            touch-action: none;
        }

        #stage {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #stage.dragging { cursor: grabbing; }

        #loading {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            background: #171525;
            color: var(--muted);
            font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            pointer-events: none;
        }

        #loading[hidden] { display: none; }
    </style>
</head>
<body>
    <div id="toolbar">
        <span class="title">Canvas game-renderer baseline · rev 356</span>
        <label>Level
            <select id="level">
                <option value="level_001">level_001</option>
                <option value="level_002">level_002</option>
                <option value="browser_copy">browser copy</option>
            </select>
        </label>
        <label>Zoom <input id="zoom" type="number" min="0.02" max="5" step="0.05" value="0.55"></label>
        <button id="fit" type="button">Fit</button>
        <button id="reset" type="button">Reset stats</button>
        <span class="spacer"></span>
        <a href="level-editor.html" style="color:var(--accent)">Back to editor</a>
    </div>
    <div id="viewport">
        <canvas id="stage"></canvas>
        <div id="loading">Loading the ordinary Canvas2D game renderer…</div>
    </div>
    <div id="readout">
        <span id="readout-main">starting…</span>
        <span id="readout-camera">x:0 y:0 zoom:0.55</span>
    </div>
    <script type="module" src="src/tools/level-renderer-baseline.js"></script>
</body>
</html>
